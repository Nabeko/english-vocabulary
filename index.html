<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英文單字王</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b2140">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="單字王">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="wrap" id="app-root">
  <header class="brand">
    <div>
      <span class="en">ENGLISH VOCABULARY</span>
      <h1>英文單字王</h1>
      <p>單字守城遊戲</p>
      <p class="ref">Reference: <a href="https://lexilereadingrex.github.io/" target="_blank" rel="noopener">https://lexilereadingrex.github.io/</a></p>
    </div>
  </header>

  <main id="view"></main>

  <footer class="foot">僅供個人學習使用</footer>
</div>

<!-- 資料檔改為按需動態載入（見 js/app.js loadLevelData），首頁不再一次灌入全部單字 -->

<!-- 程式邏輯 -->
<script src="js/battle-art.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  window.onAuthed = function(){
    if(window.App && window.App.init) window.App.init();
  };
  EVAuth.init();
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('SW register failed', err);
      });
    });
  }
</script>
</body>
</html>
